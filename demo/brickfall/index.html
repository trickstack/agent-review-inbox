<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brickfall</title>
<!-- A small neon brick breaker with no motion juice yet: no trail, no particles, no screen shake, no sound. It's the canvas
     for the demo, where an agent adds game feel and posts each change to the review inbox. ?auto=1 plays itself. -->
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#07040f; display:grid; place-items:center; }
  canvas { display:block; width:min(100vw, 100vh * 16 / 9); height:auto; }  /* fills a 16:9 window edge to edge, so clips have no border */
</style>
<canvas id="c" width="960" height="540"></canvas>
<script>
const c = document.getElementById("c"), g = c.getContext("2d");
const W = c.width, H = c.height, auto = new URLSearchParams(location.search).has("auto");
const COLS = 12, ROWS = 6, BW = W / COLS, BH = 24, TOP = 60;
let paddle, ball, bricks, score, keys = {};

function reset() {
  paddle = { x: W / 2, w: 120, h: 14, y: H - 40 };
  ball = { x: W / 2, y: H - 60, vx: 260, vy: -320, r: 8 };
  bricks = [];
  for (let r = 0; r < ROWS; r++) for (let k = 0; k < COLS; k++) bricks.push({ x: k * BW, y: TOP + r * BH, alive: true });
  score = 0;
}

addEventListener("keydown", e => keys[e.key] = true);
addEventListener("keyup", e => keys[e.key] = false);
c.addEventListener("mousemove", e => { const b = c.getBoundingClientRect(); paddle.x = (e.clientX - b.left) * W / b.width; });

function update(dt) {
  if (auto) paddle.x += (ball.x + Math.sin(ball.x * 0.05) * 30 - paddle.x) * Math.min(1, dt * 8);
  if (keys.ArrowLeft) paddle.x -= 600 * dt;
  if (keys.ArrowRight) paddle.x += 600 * dt;
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  if (ball.x < ball.r || ball.x > W - ball.r) { ball.vx *= -1; ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x)); }
  if (ball.y < ball.r) { ball.vy = Math.abs(ball.vy); }
  if (ball.y > H + 40) reset();

  if (ball.vy > 0 && ball.y + ball.r > paddle.y && ball.y < paddle.y + paddle.h && Math.abs(ball.x - paddle.x) < paddle.w / 2 + ball.r) {
    ball.vy = -Math.abs(ball.vy);
    ball.vx = (ball.x - paddle.x) / (paddle.w / 2) * 360;
  }
  for (const b of bricks) {
    if (!b.alive || ball.x < b.x || ball.x > b.x + BW || ball.y - ball.r > b.y + BH || ball.y + ball.r < b.y) continue;
    b.alive = false;
    ball.vy *= -1;
    score += 10;
    break;
  }
  if (bricks.every(b => !b.alive)) reset();
}

function glow(color, blur) { g.shadowColor = color; g.shadowBlur = blur; g.fillStyle = color; }

function box(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); }

function draw() {
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#120826");
  bg.addColorStop(1, "#05030c");
  g.shadowBlur = 0;
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);
  g.strokeStyle = "rgba(123, 44, 255, 0.10)";  // faint synthwave grid
  g.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }

  for (const b of bricks) if (b.alive) {
    const row = (b.y - TOP) / BH;
    glow(`hsl(${330 - row * 38}, 100%, 62%)`, 14);  // pink at the top, through violet and blue, to cyan
    box(b.x + 3, b.y + 3, BW - 6, BH - 6, 4);
  }
  glow("#00e5ff", 24);
  box(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 7);
  glow("#ffffff", 26);
  g.shadowColor = "#00e5ff";
  g.beginPath(); g.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); g.fill();
  glow("#ff4fd8", 12);
  g.font = "bold 20px ui-monospace, Consolas, monospace";
  g.fillText("SCORE " + score, 18, 32);
  g.shadowBlur = 0;
}

let last = performance.now();
function frame(t) {
  update(Math.min(0.033, (t - last) / 1000));
  last = t;
  draw();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
</script>
